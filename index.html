<style>

.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px}.titlebar h1{margin:0}.theme{min-width:92px;white-space:nowrap;padding:5px 9px;font-size:13px}

.ex{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--okb)}
.note{background:var(--wab);color:var(--wa);padding:6px 10px;border-radius:8px;font-size:13px}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st{text-align:center;border:1px solid var(--bd);border-radius:10px;padding:10px 4px}.big{font-size:20px;margin:4px 0 8px}

<script>
const D={"choice":[{"id":1,"t":"可靠度——串联","cat":"计算类","s":"某系统由两个部件A和B组成，A的平均无故障工作时间MTBF为2000小时，B为1000小时，平均修复时间忽略不计。假设失效率恒定、故障相互独立，运行1000小时后串联系统的可靠度约为（ ）。","opts":["0.3679","0.7513","0.6065","0.2231"],"ans":["D"],"ansn":"","ex":"λA=1/2000，R_A=e^(−0.5)≈0.6065；λB=1/1000，R_B=e^(−1)≈0.3679；串联R=0.6065×0.3679≈0.2231。","note":""},{"id":2,"t":"可靠度——并联","cat":"计算类","s":"上述两个部件采用并联冗余结构时，系统运行1000小时后的可靠度约为（ ）。","opts":["0.3679","0.7513","0.6065","0.2231"],"ans":["B"],"ansn":"","ex":"并联 R=1−(1−0.6065)(1−0.3679)=1−0.3935×0.6321≈0.7513。串联系统失效率为各部件之和，MTBF=1/0.0015≈667 小时。","note":""},{"id":3,"t":"系统可用度","cat":"计算类","s":"某系统平均无故障工作时间MTBF为1000小时，平均修复时间MTTR为10小时。按稳态可用度公式计算，其可用度约为（ ）。","opts":["0.0099","0.9900","0.9990","0.9901"],"ans":["D"],"ansn":"","ex":"可用度A=MTBF/(MTBF+MTTR)=1000/(1000+10)≈0.9901，即99.01%。考生部分文字将MTTR误记为MTTF，按可用度题意应为修复时间MTTR。","note":""},{"id":4,"t":"失效率与平均无故障时间","cat":"计算类","s":"系统故障发生率为每小时 0.02 次，故障次数服从齐次泊松过程模型，平均无故障时间MTTF 为（ ）小时。","opts":["50","100","0.02","0.98"],"ans":["A"],"ansn":"","ex":"失效率为常数时 MTTF=1/λ=1/0.02=50 小时。","note":""},{"id":5,"t":"阿姆达尔定律——概念","cat":"计算类","s":"某程序原执行时间的30%可并行化（或通过优化将该部分速度提高10倍），其余70%只能串行执行。采用10个处理器并行处理该部分，假设无额外并行开销。根据阿姆达尔定律，下列说法正确的是（ ）。","opts":["系统加速比由执行速度最快的模块决定","加速比只影响被加速模块的执行时间","整体加速比受限于不可改进部分所占的比例","局部改进倍数无限增大时，整体加速比也无限增大"],"ans":["C"],"ansn":"","ex":"阿姆达尔定律：并行/优化只作用于占比30%的部分，系统整体加速比受70%不可加速部分限制，最大理论上限为1/0.7≈1.43；本例为10个处理器（或该部分10倍提速），整体为1/(0.7+0.3/10)≈1.37。原回忆中\"最快模块决定加速比\"为错误说法。","note":""},{"id":6,"t":"阿姆达尔定律——加速比","cat":"计算类","s":"某程序原执行时间的30%可加速10倍，其余部分不变；假设无额外开销。根据阿姆达尔定律，系统整体加速比约为（ ）。","opts":["0.73","1.30","1.37","3.70"],"ans":["C"],"ansn":"","ex":"改进后时间=0.7+0.3/10=0.73，加速比=1/0.73≈1.37。","note":""},{"id":7,"t":"阿姆达尔定律——执行时间","cat":"计算类","s":"同一程序中30%可加速部分提高10倍速度后，执行同一任务所需时间为原来的（ ）。","opts":["3%","30%","70%","73%"],"ans":["D"],"ansn":"","ex":"优化后执行时间/原时间=(1−0.3)+0.3/10=0.73，即原来的73%。注意不是\"节约73%的时间\"，而是节约27%。","note":""},{"id":8,"t":"独立事件成功概率","cat":"计算类","s":"甲、乙、丙完成同一工作的成功概率分别为 30%、40%、50%。若三人的尝试相互独立，且至少一人成功即视为工作完成，则成功概率为（ ）。","opts":["6%","44%","79%","21%"],"ans":["C"],"ansn":"","ex":"三人都失败 0.7×0.6×0.5=0.21，1−0.21=0.79。恰好一人成功 0.44、全部成功 0.06 为干扰项。","note":""},{"id":9,"t":"关联规则——支持度","cat":"计算类","s":"某商品交易数据共有100条记录，其中40条包含牛奶、30条包含面包、20条同时包含两者。关联规则\"牛奶⇒面包\"的支持度为（ ）。","opts":["40%","20%","50%","66.7%"],"ans":["B"],"ansn":"","ex":"支持度=20/100=20%。","note":"考生回忆存在数据/选项差异，暂以题内说明为准。"},{"id":10,"t":"关联规则——置信度","cat":"计算类","s":"已知100条交易中牛奶出现40次、面包出现30次，两者同时出现20次，则规则\"牛奶⇒面包\"的置信度为（ ）。","opts":["20%","40%","50%","66.7%"],"ans":["C"],"ansn":"","ex":"置信度(牛奶⇒面包)=20/40=50%；支持度=20/100=20%。若方向变为\"面包⇒牛奶\"，置信度才是20/30≈66.7%。新增腾讯文档文字存在两组口述数据（牛奶40/面包30与反向说法），须以原卷为准。","note":"考生回忆存在数据/选项差异，暂以题内说明为准。"},{"id":11,"t":"缺陷检出率","cat":"计算类","s":"系统交付前发现 180 个缺陷，上线运行 6 个月又发现 20 个缺陷。按这两阶段已发现缺陷的总数计算，交付前缺陷检出率为（ ）。","opts":["88.3%","95%","90%","11.1%"],"ans":["C"],"ansn":"","ex":"180/(180+20)=90%。分母须计入后续发现的缺陷。","note":""},{"id":12,"t":"最少分组（图着色）","cat":"计算类","s":"A、B、C、D、E、F 六类物品需要分组存放，A 不能与 B、C 同组，B 不能与 D、E 同组，C 不能与 D、F 同组，D 不能与 E 同组。最少需要分为（ ）组。","opts":["3","4","5","6"],"ans":["A"],"ansn":"","ex":"B、D、E 两两冲突构成三角形，至少 3 组；{A、D、F}、{B、C}、{E} 可行。（考生1 版本为六人分房间，冲突对略有出入，答案同为 3，分组 {A、D、E}、{B、F}、{C}。）","note":"考生回忆存在数据/选项差异，暂以题内说明为准。"},{"id":13,"t":"敏捷开发——用户故事 3C","cat":"软件工程与面向对象","s":"敏捷开发中，用户故事的 3C 要素是指（ ）。","opts":["Card、Communication、Commitment","Card、Conversation、Confirmation","Context、Conversation、Confirmation","Card、Conversation、Completion"],"ans":["B"],"ansn":"","ex":"卡片记录简短描述，对话确定细节，确认以验收标准收尾。","note":""},{"id":14,"t":"开发模型选择","cat":"软件工程与面向对象","s":"客户需求非常不明确，需要通过可运行的初步系统与用户反复沟通、逐步澄清，应优先考虑（ ）模型。","opts":["螺旋模型","瀑布模型","原型模型","增量模型"],"ans":["C"],"ansn":"","ex":"需求模糊时，使用原型模型快速展示可运行版本，通过用户反馈澄清和逐步完善需求。","note":""},{"id":15,"t":"模块耦合——标记耦合","cat":"软件工程与面向对象","s":"模块 A 将包含学号、姓名、成绩等字段的学生数据结构传给模块 B，而模块 B 只使用其中一个字段。这种耦合属于（ ）。","opts":["标记耦合","控制耦合","数据耦合","公共耦合"],"ans":["A"],"ansn":"","ex":"传复杂数据结构且只使用其中一部分，为标记耦合（特征耦合）。","note":""},{"id":16,"t":"等价类划分——有效等价类","cat":"软件工程与面向对象","s":"某系统对年龄输入的要求为18～68岁（含端点），仅考虑整数的取值范围，按等价类划分有（ ）个有效等价类。","opts":["1","2","3","4"],"ans":["A"],"ansn":"","ex":"⚠️ 考生2/考生4 记忆的范围是 18～68，不影响本题答案：规定取值范围时有效等价类 1 个。","note":""},{"id":17,"t":"等价类划分——无效等价类","cat":"软件工程与面向对象","s":"某系统对年龄输入的要求为18～68岁（含端点），仅考虑整数的取值范围，按等价类划分有（ ）个无效等价类。","opts":["1","2","3","4"],"ans":["B"],"ansn":"","ex":"两个无效等价类分别是小于18和大于68，有效等价类是18～68。","note":""},{"id":18,"t":"健壮边界值测试用例","cat":"软件工程与面向对象","s":"某系统要求输入年龄为18～60岁（含端点），仅考虑整数的健壮边界值测试。下列哪组测试数据覆盖了下界外一点、下界、下界内一点、正常值，以及上界内一点、上界、上界外一点？ （ ）","opts":["17、18、19、59、60","17、18、30、60、61","17、18、19、59、60、61","17、18、19、30、59、60、61"],"ans":["D"],"ansn":"","ex":"按照健壮边界值方法，可取17、18、19、正常值30、59、60、61。需要提醒：这是一维输入变量的常见示例，原回忆仅记得部分选项，选项顺序仍是编辑重排。","note":"考生回忆存在数据/选项差异，暂以题内说明为准。"},{"id":19,"t":"用例图——参与者泛化","cat":"软件工程与面向对象","s":"UML 用例图中，管理员具有普通人员的全部权限，并额外具有删除人员的权限。管理员与普通人员两个参与者之间的关系是（ ）。","opts":["泛化","包含","关联","扩展"],"ans":["A"],"ansn":"","ex":"管理员继承普通人员的全部权限并扩展自身能力，两类参与者构成泛化关系。","note":""},{"id":20,"t":"设计模式——策略模式","cat":"软件工程与面向对象","s":"策略模式定义一系列算法，将每个算法封装起来，并使它们可以相互（ ）。","opts":["替换","互补","扩展","调用"],"ans":["A"],"ansn":"","ex":"策略模式把一组算法各自封装为独立策略，并允许在不改变上下文调用代码的情况下相互替换。","note":""},{"id":21,"t":"设计模式——观察者模式","cat":"软件工程与面向对象","s":"股票价格变化时，需要自动更新订阅该股票的多个客户端显示。适合采用（ ）设计模式。","opts":["中介者模式","访问者模式","观察者模式","状态模式"],"ans":["C"],"ansn":"","ex":"观察者模式建立一对多依赖，主题状态改变时向订阅者发送通知，以便多个界面同步更新。","note":""},{"id":22,"t":"业务流程模型——控制流","cat":"软件工程与面向对象","s":"在业务流程模型中，某条路径规定活动的执行先后；到达条件节点时选择满足条件的后继活动，遇到等待节点时暂停执行，待事件到达后再继续。该路径主要描述的是（ ）。","opts":["数据流","控制流","数据依赖关系","静态调用关系"],"ans":["B"],"ansn":"","ex":"控制流用于描述活动的执行次序、分支、等待及继续执行，与静态数据关系不同。","note":""},{"id":23,"t":"性能测试","cat":"软件工程与面向对象","s":"对同一系统进行性能测试，在业务请求组合、数据规模、硬件资源以及响应时间和错误率上限均相同的条件下，下列说法正确的是（ ）。","opts":["满足上述约束时，能够稳定承载的并发用户数更多，表明系统的并发承载能力更强","只要吞吐量高，就可忽略响应时间分位数和错误率判断性能优劣","硬件配置相同时，各实现的性能主要由并发用户数决定，无需考虑算法复杂度","并发用户数增加时，吞吐量必然同比增加，平均响应时间保持不变"],"ans":["A"],"ansn":"","ex":"在负载和资源条件相同、响应时间与错误率不超标时，能够稳定承载更多并发用户体现更强的并发能力。","note":""},{"id":24,"t":"可测试性设计","cat":"软件工程与面向对象","s":"某团队希望提高系统的可测试性，使测试人员能够稳定构造指定场景，并准确判断执行结果。下列设计措施最直接有利于实现该目标的是（ ）。","opts":["统一隐藏内部状态与事件轨迹，使测试仅依据最终页面表现判断","明确接口契约、隔离职责，并提供可控输入、可替换依赖和可观察结果","将相关模块合并成大型组件，以减少需要单独测试的接口数量","仅保留依赖真实外部环境的端到端测试，避免使用可替换依赖"],"ans":["B"],"ansn":"","ex":"可控输入、可替换依赖与可观察结果支持测试场景构造和断言，提高可测试性。","note":""},{"id":25,"t":"物理配置审计（PCA）","cat":"软件工程与面向对象","s":"软件版本交付前，配置审计人员对实际交付的源代码、可执行文件、版本清单与批准的配置文档进行核对。物理配置审计（PCA）的核心目的在于（ ）。","opts":["确认配置项实现的功能与性能满足需求规格说明","确认已完成工作量与项目进度计划一致","确认软件的实际配置与批准的配置文档及产品基线一致","确认每项变更均能提升产品功能或性能"],"ans":["C"],"ansn":"","ex":"本题依据所给定义判断。","note":""},{"id":26,"t":"4+1 视图——进程视图","cat":"软件工程与面向对象","s":"在\"4+1\"架构视图中，描述系统运行时进程、并发和通信的是（ ）。","opts":["Logical View","Process View","Development View","Physical View"],"ans":["B"],"ansn":"","ex":"进程视图关注运行时进程、并发处理、同步通信和部署前的运行结构。","note":""},{"id":27,"t":"UML 交互图","cat":"软件工程与面向对象","s":"在 UML 中，分别侧重对象间消息的时间顺序与对象协作连接关系的两种交互图是（ ）。","opts":["时序图、通信图","活动图、通信图","时序图、状态机图","通信图、活动图"],"ans":["A"],"ansn":"","ex":"顺序图突出消息发生的时间顺序；通信图突出对象间连接关系和消息编号。","note":""},{"id":28,"t":"架构描述的组成","cat":"架构设计","s":"软件架构描述包括构件、连接件以及（ ）。","opts":["架构配置","架构风格","质量属性场景","设计模式目录"],"ans":["A"],"ansn":"","ex":"软件架构通常以构件、连接件和配置（构件与连接件如何组合）进行描述。","note":""},{"id":29,"t":"架构动态性","cat":"架构设计","s":"系统运行时允许增加或删除已有类型的构件实例、连接件实例，并调整实例之间的连接关系，但不引入新的构件类型或重新定义架构的基本构造。按交互动态性、结构动态性和架构动态性的分级，该变化属于（ ）。","opts":["交互动态性","结构动态性","架构动态性","静态架构演化"],"ans":["B"],"ansn":"","ex":"构件、连接件实例及实例间连接可在运行时增删调整，但类型不变，通常属于结构动态性。","note":""},{"id":30,"t":"架构坏味道——循环依赖","cat":"架构设计","s":"订单服务需要调用库存服务，库存服务在更新时又必须反向调用订单服务。该架构坏味道称为（ ）。","opts":["循环依赖","关注点过载","层次违背","共变耦合"],"ans":["A"],"ansn":"","ex":"服务A依赖服务B，服务B又反向依赖A，形成循环依赖，增加变更和测试成本。","note":""},{"id":31,"t":"架构坏味道——共变耦合","cat":"架构设计","s":"两个服务不存在相互调用，也没有违反系统的分层规则，各自职责单一。但是，由于共同依赖一套频繁变化的报文结构，几乎每次修改其中一个服务的数据格式，都必须同步修改另一个服务，否则接口兼容性测试就会失败。最直接体现的架构坏味道是（ ）。","opts":["循环依赖","关注点过载","层次违背","共变耦合"],"ans":["D"],"ansn":"","ex":"两个服务因共同依赖并频繁同步修改某一变化点而共同演化，体现共变耦合。","note":""},{"id":32,"t":"数据流架构风格——错误说法","cat":"架构设计","s":"关于数据流架构风格，下列说法错误的是（ ）。","opts":["任一数据流架构中的阶段都必须接收到上阶段的完整数据集后才能开始处理","管道-过滤器是数据流架构的一种典型子风格","批处理序列是数据流架构的一种典型子风格","在管道-过滤器中，处理阶段可以通过输入输出数据接口连接"],"ans":["A"],"ansn":"","ex":"\"数据必须整体传递\"只适用于批处理，管道-过滤器支持增量处理。⚠️ 考生2 的选项版本（\"数据都必须以整体方式在构件间传递\"为错误项）考点相同。","note":""},{"id":33,"t":"管道-过滤器适用场景","cat":"架构设计","s":"数据依次经过清洗等多个独立处理阶段，各阶段可替换，阶段之间传递处理结果。适合采用（ ）架构。","opts":["管道-过滤器","解释器","虚拟机","仓库"],"ans":["A"],"ansn":"","ex":"数据按连续阶段流动并可逐级清洗、替换处理模块，符合管道—过滤器架构。","note":""},{"id":34,"t":"虚拟机风格","cat":"架构设计","s":"某系统通过人为构造的执行环境屏蔽底层机器差异，使程序或业务规则能够在该环境中运行。从软件架构风格的大类看，解释器和基于规则的系统均可归入该类。该架构风格是（ ）。","opts":["虚拟机风格","分层风格","解释器风格","黑板风格"],"ans":["A"],"ansn":"","ex":"虚拟机风格通过人工执行环境屏蔽底层平台的差异，解释器与规则系统可归入该类。","note":""},{"id":35,"t":"表现层——MVVM","cat":"架构设计","s":"某界面架构将业务数据及业务逻辑置于 Model ，将显示布局置于 View；中间的ViewModel 暴露状态和命令，通过数据绑定使界面与状态保持同步。该架构模式是（ ）。","opts":["MVC","MVP","MVVM","PAC"],"ans":["C"],"ansn":"","ex":"Model处理数据与业务逻辑，View负责显示，ViewModel通过状态、命令与数据绑定连接二者。","note":""},{"id":36,"t":"DSSA——建立过程","cat":"架构设计","s":"在 DSSA 的五步建立过程中，某阶段通过开发、提取或搜集可重用构件，为领域架构补充可用于构建新应用的产品单元。该阶段是（ ）。","opts":["定义领域范围","定义领域特定的元素","定义领域模型和体系结构","产生、搜集可重用的产品单元"],"ans":["D"],"ansn":"","ex":"DSSA建立过程中，产生、搜集可重用产品单元是为领域架构准备可复用构件的阶段。","note":""},{"id":37,"t":"DSSA——垂直域与水平域","cat":"架构设计","s":"关于特定领域软件架构（DSSA）的垂直域与水平域，下列说法错误的是（ ）。","opts":["垂直域面向某一特定系统族，抽取该系统族内系统的共性","水平域关注多个系统或系统族共有的功能部分","将垂直域范围适当缩小，通常更容易形成一致的领域解决方案","垂直域范围越小，形成的架构必然适用于越多不同业务领域"],"ans":["D"],"ansn":"","ex":"垂直域聚焦特定系统族；缩小领域范围并不意味着架构必然适用于更多其他领域。","note":""},{"id":38,"t":"质量属性——权衡点","cat":"架构设计","s":"提升加密强度能够提高安全性，同时增加计算耗时、降低性能。在架构评估中，从同一决定对两个质量属性产生相反影响、需要进行取舍的角度，该决定最准确地体现了（ ）。","opts":["权衡点","敏感点","风险点","非风险点"],"ans":["A"],"ansn":"","ex":"影响多个质量属性、是多个质量属性敏感点的为权衡点。","note":""},{"id":39,"t":"可用性战术——心跳","cat":"架构设计","s":"主备服务系统中，监控模块定期接收节点发送的存活消息，若连续多个周期未收到消息，则将该节点标记为疑似故障。该故障检测机制称为（ ）。","opts":["冗余副本","心跳检测","资源调度","检查点恢复"],"ans":["B"],"ansn":"","ex":"心跳检测通过周期性存活消息判断节点是否疑似失效，属于故障检测机制。","note":""},{"id":40,"t":"可用性战术归属","cat":"架构设计","s":"在软件架构质量属性战术分类中，该机制主要服务于（ ）。","opts":["性能","安全性","可用性","可靠性"],"ans":["C"],"ansn":"","ex":"心跳、Ping/Echo、异常检测属于可用性战  problem state, intermediate results, hypotheses, and partial solutions. Independent knowledge sources (74) the blackboard, while a (73) decides which knowledge source should be activated next. This style is especially suitable for (75) problems that cannot be solved by a single algorithm. The system iteratively refines its solution until a complete solution is reached. A typical example is an expert system for speech recognition or medical diagnosis."},{"id":72,"t":"英语完形 (72)","cat":"英语题","s":"请根据上述短文，为第（72）空选择最合适的词语。","opts":["independent","dependent","identical","sequential"],"ans":["A"],"ansn":"","ex":"多个独立知识源通过黑板交换中间结果。","note":"新增考生回忆提供了英语完整原文，但未给原卷挖空位置及A—D选项；本稿挖空和选项为教学用途拟制。","psg":"The blackboard architecture pattern is a software architecture style that uses a (71) global data space, called the blackboard, to support cooperative problem solving among multiple (72) knowledge sources. The blackboard stores the current problem state, intermediate results, hypotheses, and partial solutions. Independent knowledge sources (74) the blackboard, while a (73) decides which knowledge source should be activated next. This style is especially suitable for (75) problems that cannot be solved by a single algorithm. The system iteratively refines its solution until a complete solution is reached. A typical example is an expert system for speech recognition or medical diagnosis."},{"id":73,"t":"英语完形 (73)","cat":"英语题","s":"请根据上述短文，为第（73）空选择最合适的词语。","opts":["client","control scheduler","compiler","database"],"ans":["B"],"ansn":"","ex":"控制调度器决定激活哪个知识源。","note":"新增考生回忆提供了英语完整原文，但未给原卷挖空位置及A—D选项；本稿挖空和选项为教学用途拟制。","psg":"The blackboard architecture pattern is a software architecture style that uses a (71) global data space, called the blackboard, to support cooperative problem solving among multiple (72) knowledge sources. The blackboard stores the current problem state, intermediate results, hypotheses, and partial solutions. Independent knowledge sources (74) the blackboard, while a (73) decides which knowledge source should be activated next. This style is especially suitable for (75) problems that cannot be solved by a single algorithm. The system iteratively refines its solution until a complete solution is reached. A typical example is an expert system for speech recognition or medical diagnosis."},{"id":74,"t":"英语完形 (74)","cat":"英语题","s":"请根据上述短文，为第（74）空选择最合适的词语。","opts":["modify without reading","read from and write to","delete from","hide from"],"ans":["B"],"ansn":"","ex":"知识源从黑板读取，也向黑板写入。","note":"新增考生回忆提供了英语完整原文，但未给原卷挖空位置及A—D选项；本稿挖空和选项为教学用途拟制。","psg":"The blackboard architecture pattern is a software architecture style that uses a (71) global data space, called the blackboard, to support cooperative problem solving among multiple (72) knowledge sources. The blackboard stores the current problem state, intermediate results, hypotheses, and partial solutions. Independent knowledge sources (74) the blackboard, while a (73) decides which knowledge source should be activated next. This style is especially suitable for (75) problems that cannot be solved by a single algorithm. The system iteratively refines its solution until a complete solution is reached. A typical example is an expert system for speech recognition or medical diagnosis."},{"id":75,"t":"英语完形 (75)","cat":"英语题","s":"请根据上述短文，为第（75）空选择最合适的词语。","opts":["trivial","single-purpose","deterministic","complex, uncertain, or knowledge-intensive"],"ans":["D"],"ansn":"","ex":"黑板架构适用于复杂、不确定、知识密集、难以用单一算法解决的问题。","note":"新增考生回忆提供了英语完整原文，但未给原卷挖空位置及A—D选项；本稿挖空和选项为教学用途拟制。","psg":"The blackboard architecture pattern is a software architecture style that uses a (71) global data space, called the blackboard, to support cooperative problem solving among multiple (72) knowledge sources. The blackboard stores the current problem state, intermediate results, hypotheses, and partial solutions. Independent knowledge sources (74) the blackboard, while a (73) decides which knowledge source should be activated next. This style is especially suitable for (75) problems that cannot be solved by a single algorithm. The system iteratively refines its solution until a complete solution is reached. A typical example is an expert system for speech recognition or medical diagnosis."}],"case":[{"id":1,"n":"试题一","sc":25,"t":"空气质量监测系统的架构设计","intro":"某城市计划建设空气质量监测与分析系统，对全市多个环境监测站上报的数据进行统一处理。监测站定期采集空气中的污染物浓度、风向、风速等信息，并将数据上传至中心平台。系统对采集的数据进行汇总、清洗、加工与分析，计算各监测站及区域的空气质量状况，根据空气质量等级使用不同颜色进行标记，并向用户提供空气质量信息查询服务。\n在系统架构设计过程中，项目组需要对系统的性能、安全性、可用性、易用性、可测试性和可修改性等质量属性进行分析。随着监测站数量和用户访问量的增加，系统需要通过集群提高处理能力。但由于计算资源有限，项目组提出从污染物和监测站请求两个维度抽取部分处理任务，以提高资源使用效率和系统响应能力。","parts":[{"t":"问题1 · 质量属性场景分析","sc":12,"tx":"软件架构质量属性场景主要由刺激源、刺激、环境、制品、响应和响应度量六个要素组成。请根据题目提供的12个备选描述，识别相应的质量属性，并将质量属性场景中的六个要素填入对应位置。\n涉及的质量属性包括：性能、安全性、可用性、易用性、可测试性和可修改性。（原题的12个备选项及填空表格尚缺失 ）","tb":null},{"t":"问题2 · 架构设计方案分析","sc":13,"tx":"在计算资源有限的情况下，李工提出分别从\"污染物字段抽取\"和\"监测站请求抽取\"两个角度进行系统架构优化。\n请根据题目要求：\n（1）说明基于污染物字段抽取的架构设计方案及其工作机制。\n（2）说明基于监测站请求抽取的架构设计方案及其工作机制。\n（3）比较上述两种架构设计方案的优点和局限性。","tb":null}]},{"id":2,"n":"试题二","sc":25,"t":"Redis主从复制与哨兵模式","intro":"某互联网平台为提高用户访问效率，使用Redis存储热点榜单等高频访问数据，并采用主从复制和读写分离架构，由主节点负责写入，从节点负责读取。随着业务量不断增长，系统在运行过程中出现主从数据同步延迟，导致部分用户查询到的热点榜单不是最新数据。此外，某次Redis主节点发生故障，系统需要由运维人员人工排查和恢复，导致热榜查询及部分核心业务无法正常使用，影响用户体验。为提高系统的可靠性，项目组计划进一步研究Redis数据同步机制和哨兵模式。","parts":[{"t":"问题1 · Redis数据同步机制","sc":7,"tx":"Redis主从复制过程中涉及全量同步、增量同步和基于命令的持续同步。请根据题目给出的同步场景及特点，完成三种数据同步方式的对比表格。主要比较内容包括：（1）适用场景。（2）数据同步内容。（3）同步过程及持续性。（4）数据传输量和资源开销。\n（ 原题为表格填空，部分行列名称及空格数量缺失 ）。","tb":null},{"t":"问题2 · Redis读写分离的数据一致性","sc":6,"tx":"在系统采用Redis主从读写分离后，用户可能从从节点读取到尚未同步的旧数据。请从业务应用角度分析该问题，并提出相应的解决方法。","tb":null},{"t":"问题3 · Redis主从复制模式的缺陷","sc":4,"tx":"某次Redis主节点发生故障，需要运维人员人工排查并恢复服务，导致热搜榜单查询及部分核心功能无法正常工作。请结合案例，分析单纯采用Redis主从复制模式存在的主要缺陷。","tb":null},{"t":"问题4 · Redis哨兵模式及故障转移","sc":8,"tx":"为解决Redis主节点故障无法自动恢复的问题，项目组准备引入Sentinel哨兵模式。\n请根据题目给出的哨兵工作过程，回答以下问题：\n（1）说明主观下线（SDOWN）与客观下线（ODOWN）的判断条件及区别。\n（2）根据哨兵模式的主从选举和故障转移流程图，填写相应的处理步骤。","tb":null}]},{"id":3,"n":"试题三","sc":25,"t":"电商商品推荐与第三方支付系统","intro":"某电商平台经营大量不同类型的商品，其中热门商品具有较高的访问量和购买量，而大量长尾商品的访问量较少、用户交互数据不足。为提高长尾商品的曝光率和推荐效果，项目组计划使用基于内容的推荐和协同过滤推荐两种方法，实现商品个性化推荐。\n在系统架构设计方面，平台采用客户端/服务器架构，为用户提供商品浏览、推荐、下单和支付等功能，并与第三方支付平台进行系统对接。由于支付过程涉及用户身份、支付凭证和交易数据，项目组还需防范伪造请求、重复提交及重放攻击等安全风险。","parts":[{"t":"问题1 · 长尾商品推荐算法分析","sc":8,"tx":"请结合电商平台中的长尾商品，回答以下问题：\n（1）说明长尾商品的主要特点。\n（2）分析基于内容的推荐算法是否适合长尾商品推荐，并说明理由。\n（3）分析协同过滤推荐算法是否适合长尾商品推荐，并说明理由。","tb":null},{"t":"问题2 · 客户端/服务器架构设计","sc":7,"tx":"根据电商平台的业务需求，项目组设计了客户端/服务器系统架构。\n请根据题目给出的系统架构图，将相应的系统组成部分填写到指定位置。\n原题架构图及备选组件尚缺失，暂时只能确定考查形式。","tb":null},{"t":"问题3 · 第三方支付接口安全设计","sc":10,"tx":"电商平台向第三方支付系统发起支付请求，并携带相关支付凭证。第三方支付平台完成支付后，通过回调接口向业务系统通知支付结果。\n在此过程中，系统面临多种网络安全威胁，包括请求伪造、重复提交和重放攻击等。\n项目组提出采用数字签名、时间戳与TTL、Nonce随机数等技术进行安全防护。\n请根据题目给出的三种安全场景：\n（1）分别选择相应的安全防护技术。\n（2）说明各项安全防护技术的基本原理和工作机制。","tb":null}]},{"id":4,"n":"试题四","sc":25,"t":"老旧小区设备运维管理系统UML建模","intro":"某公司开发老旧小区设备运维管理系统，实现对小区设备的日常巡检、故障上报、维修处理及复审管理。\n系统主要业务流程如下：\n（1）系统按照预设巡检计划，定期生成并发布巡检工单。\n（2）巡检人员接收巡检工单，到达现场后通过手持扫描设备扫描二维码，识别待巡检设备。\n（3）巡检人员检查设备运行状态，填写巡检结果并提交报告。\n（4）当巡检过程中发现设备异常时，系统根据异常信息生成故障维修工单，并派发给维修人员。（5）维修人员接单后前往现场进行设备维修，完成后填写维修报告并上传照片等材料。\n（6）管理员对维修结果进行复审。审核通过后，系统关闭维修工单；审核不通过时，维修人员继续处理，直至审核通过。\n项目组采用面向对象方法进行系统分析与设计，并通过UML模型描述系统的业务流程、对象关系及对象间通信。","parts":[{"t":"问题1 · UML活动图填空","sc":8,"tx":"根据老旧小区设备巡检、故障上报及维修处理流程，项目组绘制了包含系统、巡检人员、维修人员和管理员等泳道的UML活动图。请根据题目描述，补充活动图中缺失的活动或对象（包括回忆中的实体1---3等）。\n（ 原题活动图缺失 ）","tb":null},{"t":"问题2 · UML六种关系","sc":10,"tx":"在面向对象分析与设计中，类之间存在泛化、实现、关联、聚合、组合和依赖等关系。\n请完成以下任务：\n（1）简要说明UML中六种关系的含义。\n（2）根据给定的对象关系描述，判断相应的UML关系，并填写表格。\n回忆的主要关系场景如下：\n上述表格是根据回忆重整的文字，原题对象名称及第5项关系描述尚不完整。","tb":[["对象A","对象B","关系描述"],["工单","巡检工单、故障工单","巡检工单与故障工单属于不同类型的工单"],["运维人员","运维工单记录","运维人员与工单记录存在业务联系"],["巡检人员","手持扫描设备","巡检人员使用扫描设备，使用后归还"],["巡检记录","巡检记录的组成信息","删除巡检记录后，相关组成信息同时删除"],["Excel导出功能","XX导出、YY导出","两种具体的Excel导出功能"]]},{"t":"问题3 · UML通信图填空","sc":7,"tx":"项目组根据巡检工单与维修工单的业务处理过程，绘制了对象间交互的UML通信图。请根据业务描述及图中对象之间的连接关系，补充图中缺失的对象、消息及消息编号。","tb":null}]},{"id":5,"n":"试题五","sc":25,"t":"AI辅助嵌入式系统架构设计","intro":"某企业计划开发嵌入式电机控制系统，需要满足实时性、稳定性、可靠性及资源约束等要求。为提高软件开发效率，项目管理者建议使用人工智能技术辅助完成系统需求分析、架构设计、代码编写和测试验证等工作。但项目组成员李工认为，生成式AI通过概率模型生成结果，可能存在不确定性、错误或不符合设计约束等问题，而嵌入式系统通常对确定性和可控性要求较高，因此担心直接使用AI生成结果会影响系统稳定性。项目组对此展开讨论，并计划制定AI辅助嵌入式系统开发的实施方案。","parts":[{"t":"问题1 · AI辅助架构设计的风险分析","sc":7,"tx":"嵌入式系统通常要求较高的稳定性、可靠性、可控性和确定性，而生成式AI具有概率性和输出不确定性的特点。\n请结合嵌入式系统的特点，分析AI辅助架构设计可能在哪些方面影响系统的稳定性、可控性和确定性。","tb":null},{"t":"问题2 · AI辅助嵌入式系统开发过程","sc":12,"tx":"项目组计划将AI技术应用于嵌入式软件开发的不同阶段。\n题目给出了AI辅助开发的四个阶段，以及A～L等12条AI应用活动描述。\n请根据各阶段的主要任务，将相应的AI辅助活动填入对应表格。\n回忆的四个阶段如下：","tb":[["阶段","AI辅助开发阶段","对应选项"],["第一阶段","AI辅助系统分析与需求分析","待补充"],["第二阶段","AI辅助架构设计与详细设计","待补充"],["第三阶段","AI辅助代码编写与优化","待补充"],["第四阶段","AI辅助测试与验证","待补充"]]},{"t":"问题3 · 嵌入式分层架构的优势","sc":6,"tx":"项目组针对嵌入式电机控制系统设计了分层架构，回忆中涉及应用层、服务层、中间件层、驱动层、硬件抽象层（HAL）和硬件层等组成部分。请结合题目给出的嵌入式电机控制系统架构图，说明采用该分层架构的三个主要优点。","tb":null}]}],"essay":[{"id":1,"n":"试题一","sc":75,"t":"论大模型幻觉治理技术的应用与实践","intro":"随着人工智能技术的快速发展，大语言模型（Large Language Model，LLM）已广泛应用于企业知识问答、智能客服、智能运维和辅助决策等领域。然而，大语言模型在生成内容时，可能出现与客观事实不符、缺乏依据、错误引用知识以及生成虚构信息等问题，这类现象通常称为大模型幻觉。\n特别是在知识问答和检索增强生成（RAG）场景中，幻觉可能由模型自身的知识缺陷、知识库内容错误、检索结果不准确以及模型推理偏差等因素引起。如何识别和治理不同类型的幻觉，提高模型回答的准确性、可靠性和可追溯性，是大模型应用系统架构设计的重要问题。\n请围绕\"论大模型幻觉治理技术的应用与实践\"论题，依次从以下三个方面进行论述。\n1. 概要叙述你参与管理和开发的软件项目，以及你在其中承担的主要工作。\n2. 分析知识问答与检索增强生成场景下大模型幻觉的主要表现形式，并针对不同的幻觉表现形式，说明相应的治理技术和解决方案。\n3. 结合你具体参与管理和开发的软件项目，详细论述项目中遇到的大模型幻觉问题、采取的治理措施及实施过程，并分析最终的应用效果。"},{"id":2,"n":"试题二","sc":75,"t":"论IT系统运维的应用与实践","intro":"随着企业信息化程度不断提高，IT系统规模持续扩大，系统架构日益复杂，传统依赖人工巡检、被动响应和经验判断的运维模式，已难以满足现代信息系统对可靠性、可用性和运维效率的要求。\nIT系统运维涉及资源管理、运行监控、事件管理、故障处理、问题管理、变更管理及持续优化等多个环节。近年来，人工智能技术逐步应用于IT运维领域，通过异常检测、智能告警、故障根因分析、知识问答和自动化处置等手段，提升运维工作的智能化水平。\n请围绕\"论IT系统运维的应用与实践\"论题，依次从以下三个方面进行论述。\n1. 概要叙述你参与管理和开发的软件项目，以及你在其中承担的主要工作。\n2. 详细描述IT系统运维的核心流程，并说明各个步骤的主要工作内容。\n3. 结合你具体参与管理和开发的软件项目，阐述IT系统运维的具体实施过程，说明在哪些环节应用了AI智能运维技术，以及取得的应用效果。"},{"id":3,"n":"试题三","sc":75,"t":"论数据湖的设计与实践","intro":"随着大数据、物联网、人工智能等技术的发展，企业在生产经营过程中积累了大量不同类型的数据，包括关系型数据库中的结构化数据、日志及JSON等半结构化数据，以及图片、音频、视频等非结构化数据。传统数据仓库在处理海量异构数据时，可能面临数据类型支持受限、扩展成本较高和数据处理灵活性不足等问题。\n数据湖（Data Lake）通过统一的数据存储与管理机制，支持多种类型的数据接入、存储、处理和分析，为数据治理、业务分析及智能应用提供支撑。在实际建设过程中，需要综合考虑数据湖的架构设计、数据采集、存储组织、元数据管理、数据质量、安全控制和数据服务等问题。\n请围绕\"论数据湖的设计与实践\"论题，依次从以下三个方面进行论述。\n1. 概要叙述你参与管理和开发的软件项目，以及你在其中承担的主要工作。\n2. 详细描述数据湖设计的主要工作步骤，并说明数据湖技术的主要特点和优势。\n3. 结合你具体参与管理和开发的软件项目，详细阐述如何在项目中应用数据湖相关技术，以及最终取得的应用效果。"},{"id":4,"n":"试题四","sc":75,"t":"论RAG检索增强生成技术的应用与实践","intro":"随着大语言模型技术的发展，企业逐步将其应用于智能客服、企业知识问答、辅助决策和智能运维等业务场景。然而，传统大语言模型主要依赖训练过程中形成的参数化知识，在处理企业内部专业知识时，容易出现知识更新不及时、专业领域知识不足、回答缺乏依据以及生成内容不准确等问题。\n检索增强生成（Retrieval-Augmented Generation，RAG）通过将外部知识检索与大语言模型生成能力相结合，使模型能够利用检索到的相关知识生成回答。RAG通常涉及文档采集、数据预处理、文本分块、向量化、索引构建、知识检索、重排序和答案生成等环节。如何合理设计RAG系统架构，提高知识检索准确性和答案生成质量，已成为大模型应用系统建设中的重要问题。\n请围绕\"论RAG检索增强生成技术的应用与实践\"论题，依次从以下三个方面进行论述。\n1. 概要叙述你参与管理和开发的软件项目，以及你在其中承担的主要工作。\n2. 详细阐述RAG检索增强生成技术的基本原理、核心组成和主要工作流程，并说明RAG技术的特点及优势。\n3. 结合你具体参与管理和开发的软件项目，详细论述如何应用RAG技术完成系统架构设计与实施，包括知识库构建、检索策略设计、答案生成以及系统优化等内容，并分析实施过程中遇到的问题、解决措施及应用效果。"}]},Q=D.choice,PASS=45,K='sjs2610:',mem={};

const applyTheme=()=>{
  const root=document.documentElement;
  if(theme==='auto')root.removeAttribute('data-theme');else root.dataset.theme=theme;
  const button=$('#theme');
  if(button){const [icon,label,next]=themeMeta[theme]||themeMeta.auto;button.textContent=`${icon} ${label}`;button.title=next;button.setAttribute('aria-label',next)}
};
applyTheme();
const scheme=window.matchMedia?.('(prefers-color-scheme: dark)');
scheme?.addEventListener?.('change',()=>{if(theme==='auto')applyTheme()});
const ok=(q,l)=>q.ans.includes(l);
const P=s=>String(s||'').split('\n').filter(x=>x.trim()).map(x=>`<p class="${/^[（(]\s*原题|上述表格是根据回忆/.test(x)?'note':''}">${E(x)}</p>`).join('');
const tbl=t=>`<div class="tw"><table>${t.map((r,i)=>`<tr>${r.map(c=>`<${i?'td':'th'}>${E(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table></div>`;
const sumC=()=>cs.sel.reduce((a,id)=>a+(+cs.sc[id]||0),0);
const stat=(s,n)=>s==null?'<span class="mu">未估分</span>':`<b class="${s>=PASS?'g':'r'}">${s}</b>/${n}`;
const verdict=s=>s>=PASS?'<b class="g">达到合格线 45</b>':'<b class="r">未达合格线 45</b>';
const tot=k=>k=='case'?`已选 ${cs.sel.length}/3 题 · 自评 <b>${sumC()}</b>/75 · ${verdict(sumC())}`:`${es.sel?'已选 1 题':'未选题'} · 自评 <b>${es.sel?es.sc||0:0}</b>/75 · ${verdict(es.sel?es.sc||0:0)}`;

function home(){
  const l=hist[hist.length-1],a=[l?l.s:null,cs.sel.length?sumC():null,es.sel&&es.sc!=null?es.sc:null];
  const box=(n,v,t)=>`<div class="st"><div class="mu">${n}</div><div class="big">${stat(v,75)}</div><button data-a="tab" data-v="${t}">进入</button></div>`;
  const done=a.every(x=>x!=null);
  return `<div class="card"><h2>三科估分总览</h2><div class="g3">${box('综合知识',a[0],'choice')}${box('案例分析',a[1],'case')}${box('论文',a[2],'essay')}</div>
  <p class="mu">每科满分 75 分，三科都 ≥ 45 分才算通过。${done?(a.every(x=>x>=PASS)?'<b class="g">三科估分均达到合格线 🎉</b>':'<b class="r">有科目低于 45 分</b>'):'三科都完成估分后，这里会给出综合判断。'}</p></div>
  <div class="card"><h2>两种用法</h2><p><b>📖 背题模式</b>：直接看题目和参考答案、解析，可按板块筛选、收藏；也可隐藏答案，点选项自测。</p><p><b>✍️ 估分模式</b>：综合知识逐题作答、交卷算分；案例分析与论文为自评打分（资料里没有这两科的参考答案）。</p></div>
  <div class="card"><h2>综合知识估分记录</h2>${hist.length?hist.slice(-10).reverse().map(h=>`<div class="row"><span>${new Date(h.t).toLocaleString()}</span>${stat(h.s,h.n)}</div>`).join(''):'<p class="mu">还没有记录</p>'}</div>
  <button data-a="clear">清除本机所有记录</button>`}

const mbar=k=>`<div class="seg">${[['study','📖 背题模式','答案直接可见'],['exam','✍️ 估分模式','自己作答，算分']].map(([m,n,d])=>`<button class="${md[k]==m?'on':''}" data-a="md" data-v="${k}:${m}"><b>${n}</b><small>${d}</small></button>`).join('')}</div>`;

function opts(q,o){return q.opts.map((t,i)=>{const l='ABCD'[i];let c='o';
  if(o.show){if(ok(q,l))c+=' ok';else if(o.pick==l)c+=' bad'}else if(o.pick==l)c+=' sel';
  return `<div class="${c}"${o.act?` data-a="${o.act}" data-v="${q.id}|${l}"`:''}><span class="l">${l}</span><span>${E(t)}</span></div>`}).join('')}
const exp=q=>`<div class="ex"><b>参考答案：${q.ans.join(' / ')}${q.ansn?'（'+E(q.ansn)+'）':''}</b><p>${E(q.ex)}</p>${q.note?`<p class="note">⚠ ${E(q.note)}</p>`:''}</div>`;
const qcard=(q,o)=>`<div class="card"><div class="qh"><span class="tag">${q.id}. ${E(q.t)}</span><span class="mu">${E(q.cat)}</span>${o.fav?`<button class="s" data-a="fav" data-v="${q.id}">${fav.includes(q.id)?'★':'☆'}</button>`:''}</div>${q.psg?`<div class="psg">${E(q.psg).replace(/\((7[1-5])\)/g,'<b>($1)</b>')}</div>`:''}<p class="stem">${E(q.s)}</p>${opts(q,o)}${o.show?exp(q):''}</div>`;

function study(){
  const cats=[...new Set(Q.map(q=>q.cat))],list=Q.filter(q=>cat=='all'||(cat=='fav'?fav.includes(q.id):q.cat==cat));
  const ch=[['all','全部 '+Q.length],...cats.map(c=>[c,c]),['fav','★ 收藏 '+fav.length]];
  return `<div class="chips">${ch.map(([k,n])=>`<button class="${cat==k?'on':''}" data-a="cat" data-v="${k}">${E(n)}</button>`).join('')}</div>
  <div class="bar"><span class="mu">共 ${list.length} 题</span><button data-a="hide">${hide?'显示全部答案':'隐藏答案，点选项自测'}</button></div>`+
  (list.length?list.map(q=>{const p=rv[q.id];return qcard(q,{show:!hide||p,pick:p,act:hide&&!p?'rv':'',fav:1})}).join(''):'<div class="card mu">这里还没有题目</div>')}

function exam(){
  if(ex.done)return result();
  const q=Q[ex.i],n=Object.keys(ex.a).length,last=ex.i>=Q.length-1;
  return `<div class="bar"><b>第 ${ex.i+1}/${Q.length} 题</b><span class="mu">已答 ${n}</span><button class="pri" data-a="submit">交卷</button></div><div class="pg"><i style="width:${n/Q.length*100}%"></i></div>`+
  qcard(q,{pick:ex.a[q.id],act:'pick'})+
  `<div class="bar"><button data-a="go" data-v="${ex.i-1}" ${ex.i?'':'disabled'}>← 上一题</button><button class="pri" data-a="go" data-v="${ex.i+1}" ${last?'disabled':''}>下一题 →</button></div>
  <details class="card"><summary>答题卡（点击跳题）</summary><div class="sheet">${Q.map((x,i)=>`<button class="${ex.a[x.id]?'dn':''} ${i==ex.i?'on':''}" data-a="go" data-v="${i}">${x.id}</button>`).join('')}</div></details>`}

function result(){
  let s=0;const by={},wr=[];
  Q.forEach(q=>{const a=ex.a[q.id],r=a&&ok(q,a),b=by[q.cat]=by[q.cat]||[0,0];b[1]++;if(r){s++;b[0]++}else wr.push(q)});
  return `<div class="card c"><div class="mu">综合知识估分</div><div class="huge ${s>=PASS?'g':'r'}">${s}<small>/${Q.length}</small></div><p>${verdict(s)} · 未作答 ${Q.length-Object.keys(ex.a).length} 题</p><button class="pri" data-a="redo">重新答题</button></div>
  <div class="card"><h2>各板块正确率</h2>${Object.entries(by).map(([k,v])=>`<div class="row"><span>${E(k)}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div>
  <h2>错题与未答（${wr.length}）</h2>`+wr.map(q=>qcard(q,{show:1,pick:ex.a[q.id],fav:1})).join('')}

function blk(x,k){
  const e=md[k]=='exam',c=k=='case',S=c?cs:es,on=c?cs.sel.includes(x.id):es.sel==x.id;
  return `<div class="card"><div class="qh"><span class="tag">${E(x.n)}（${x.sc}分）</span>${e?`<label class="chk"><input type="checkbox" data-a="${c?'sel':'esel'}" data-v="${x.id}" ${on?'checked':''}> 我选这题</label>`:''}</div><h3>${E(x.t)}</h3>${P(x.intro)}
  ${(x.parts||[]).map(p=>`<div class="part"><b>${E(p.t)}（${p.sc}分）</b>${P(p.tx)}${p.tb?tbl(p.tb):''}</div>`).join('')}
  ${e&&on?`<textarea data-i="nt:${k}:${x.id}" placeholder="写下你的作答要点（自动保存在本机）">${E(S.nt[x.id]||'')}</textarea><label>自评得分（0–${x.sc}）<input type="number" inputmode="numeric" min="0" max="${x.sc}" data-i="sc:${k}:${x.id}" value="${c?(cs.sc[x.id]??''):(es.sc??'')}"></label>`:''}</div>`}
const vSub=(k,msg)=>mbar(k)+`<div class="card note">${msg}</div>`+D[k].map(x=>blk(x,k)).join('')+(md[k]=='exam'?`<div class="bar sticky" id="tot">${tot(k)}</div>`:'');
const views={home,choice:()=>mbar('choice')+(md.choice=='study'?study():exam()),
  case:()=>vSub('case','资料里只有案例分析的题目，没有参考答案，部分原题图表也缺失。共 5 题选 3 题，每题 25 分；估分模式为自评，对照教材或老师的答案打分。'),
  essay:()=>vSub('essay','资料里只有论文题目，没有参考范文。4 题选 1 题，满分 75 分；估分模式为自评，可在文本框里写提纲。')};
const TABS=[['home','总览'],['choice','综合知识'],['case','案例分析'],['essay','论文']];
function render(){$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="${tab==k?'on':''}" data-a="tab" data-v="${k}">${n}</button>`).join('');$('#app').innerHTML=(views[tab]||home)()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  if(a=='tab'){tab=v;set('tab',v)}
  else if(a=='theme'){theme=theme=='auto'?'light':theme=='light'?'dark':'auto';set('theme',theme);applyTheme()}
  else if(a=='md'){const[k,m]=v.split(':');md[k]=m;set('md',md)}
  else if(a=='cat')cat=v;
  else if(a=='hide'){hide=!hide;rv={}}
  else if(a=='rv'){const[i,l]=v.split('|');rv[i]=l}
  else if(a=='fav'){const i=+v;fav=fav.includes(i)?fav.filter(x=>x!=i):[...fav,i];set('fav',fav)}
  else if(a=='pick'){const[i,l]=v.split('|');ex.a[i]=l;set('exam',ex)}
  else if(a=='go'){ex.i=+v;set('exam',ex)}
  else if(a=='submit'){const u=Q.length-Object.keys(ex.a).length;if(u&&!confirm(`还有 ${u} 题未作答，确定交卷？`))return;
    ex.done=true;set('exam',ex);hist.push({t:Date.now(),n:Q.length,s:Q.filter(q=>ex.a[q.id]&&ok(q,ex.a[q.id])).length});set('hist',hist)}
  else if(a=='redo'){if(!confirm('清空本次答案并重新开始？'))return;ex={a:{},i:0,done:false};set('exam',ex)}
  else if(a=='sel'){const i=+v;if(cs.sel.includes(i))cs.sel=cs.sel.filter(x=>x!=i);else if(cs.sel.length>=3)alert('案例分析 5 选 3，最多选 3 题');else cs.sel.push(i);set('cs',cs)}
  else if(a=='esel'){es.sel=es.sel==+v?null:+v;set('es',es)}
  else if(a=='clear'){if(!confirm('确定清除本机保存的所有答题记录？'))return;try{Object.keys(localStorage).filter(k=>k.startsWith(K)).forEach(k=>localStorage.removeItem(k))}catch(_){}location.reload();return}
  render();if(['tab','md','go','submit','redo'].includes(a))scrollTo(0,0)});
document.addEventListener('input',e=>{
  const t=e.target,i=t.dataset.i;if(!i)return;const[f,k,id]=i.split(':'),S=k=='case'?cs:es;
  if(f=='nt')S.nt[id]=t.value;
  else{const v=t.value===''?null:Math.max(0,Math.min(+t.max,+t.value));if(k=='case')cs.sc[id]=v;else es.sc=v}
  set(k=='case'?'cs':'es',S);const el=$('#tot');if(el)el.innerHTML=tot(k)});
render();
</script></body></html>
